# Dependency Score Schema
# The loop consults this schema when auto-scoring.
# Detailed rules and verdict criteria follow core/dependency-score.md.
# Timing: post-implementation. Sibling schema of readiness-score (pre-implementation).

version: "1.0"
total_points: 100

# The completion threshold is strictly greater than 85. Exactly 85 is incomplete.
thresholds:
  COMPLETE:
    min_exclusive: 85
    description: "Fully finished (complete) — but only when the gating rule (GR-1) passes."
  INCOMPLETE:
    max: 85
    description: "Incomplete. Improve the weak axes and re-score."

areas:
  - id: dependency_resolution
    name: "Dependency resolution"
    max_points: 25
    cap_rule:
      condition: "When 1 or more unresolved dependencies are marked BLOCK (GR-2)"
      max_allowed: 12
    criteria:
      - id: functional_order_deps
        description: "All feature-ordering dependencies are satisfied"
        points: 8
        check: "Every feature-ordering checklist item in the dependency md is resolved"
      - id: build_library_deps
        description: "All build/library dependencies are configured and resolved"
        points: 8
        check: "Every build/library checklist item in the dependency md is resolved"
      - id: module_deps
        description: "All inter-module dependencies (API calls/implementations) are satisfied"
        points: 9
        check: "Every inter-module checklist item in the dependency md is resolved"

  - id: build_pass
    name: "Build/compile pass"
    max_points: 25
    evidence_required: true   # Only real command execution results count. 0 points if not executed (FR-4).
    zero_if_not_executed: true
    criteria:
      - id: build_success
        description: "The build command completed successfully"
        points: 15
        check: "Build command exit code 0 (execution log evidence required)"
      - id: warnings_under_threshold
        description: "Warnings are at or below the threshold"
        points: 5
        check: "Build warning count at or below the threshold ('not applicable' when no threshold is defined)"
      - id: lint_pass
        description: "Lint/static analysis passes"
        points: 5
        check: "Lint/static analysis command passes ('not applicable' when none exists)"

  - id: test_pass
    name: "Test pass / coverage"
    max_points: 25
    evidence_required: true   # Only real command execution results count. 0 points if not executed (FR-4).
    zero_if_not_executed: true
    criteria:
      - id: tests_pass
        description: "All related tests pass"
        points: 15
        check: "Test command results all passing (report evidence required)"
      - id: coverage_target
        description: "Coverage meets the target"
        points: 5
        check: "Coverage target met ('not applicable' and excluded from the maximum when no target is defined)"
      - id: edge_case_tests
        description: "Exception/edge-case tests exist"
        points: 5
        check: "At least 1 exception/edge-case test"

  - id: ac_satisfaction
    name: "Requirements / AC satisfaction"
    max_points: 25
    score_source: "unit-of-work.md UOW acceptance criteria + requirements.md Functional Requirements (FR-5)"
    criteria:
      - id: uow_acceptance
        description: "Each UOW's acceptance criteria are satisfied"
        points: 15
        check: "Each UOW's acceptance criteria in unit-of-work.md are satisfied by the deliverables"
      - id: functional_requirements
        description: "requirements Functional Requirements are reflected"
        points: 10
        check: "requirements.md Functional Requirements are reflected in the implementation"

gating_rules:
  - id: GR-1
    description: "Even above 85 total, do not judge COMPLETE while the build axis (build_pass) is 0"
    blocks_complete: true
  - id: GR-2
    description: "With 1 or more unresolved BLOCK dependencies, the dependency_resolution area is capped at 12"
    cap_area: dependency_resolution
    cap_value: 12

# Loop control parameters (configurable — ADR-5). Overridable via slash-command args / dependency md header.
loop_control:
  complete_threshold_exclusive: 85
  stall_rounds: 2            # stop as stalled after N consecutive rounds without improvement (fixed)
  max_rounds: 10             # default, configurable
  max_minutes: 30            # default, configurable
  regression_action: "report_only"   # v1: report only, no automatic rollback (FR-10)
  on_limit: "stop_and_report"         # on cap/stall/regression: stop and report immediately, no auto-restart (FR-13)

rules:
  - "The build and test axes accept only real command execution results (exit codes/reports) as evidence. 0 points if not executed."
  - "Never clear a BLOCK dependency just to raise the score."
  - "Record every score with its evidence, never numbers alone."
  - "Undefined sub-items (e.g. coverage target) score 'not applicable' and are excluded from the maximum, not 0."
  - "The completion threshold is strictly greater than 85. Exactly 85 is incomplete."
