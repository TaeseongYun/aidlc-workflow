# Readiness Score Schema
# Skills consult this schema when auto-scoring.
# Detailed rules and verdict criteria follow core/readiness-score.md.

version: "1.0"
total_points: 100

thresholds:
  READY:
    min: 80
    description: "Implementable. 0 BLOCK questions."
  CONDITIONAL:
    min: 60
    max: 79
    description: "Conditional proceed. ASSUME assumptions must be specified in status.md."
  NOT_READY:
    max: 59
    description: "Implementation prohibited. BLOCK questions need resolution."

areas:
  - id: scope_definition
    name: "Feature scope definition"
    max_points: 15
    criteria:
      - id: goal_clarity
        description: "The Goal is clear"
        points: 5
        check: "requirements.md Goal section contains a concrete, measurable objective"
      - id: scope_boundary
        description: "In-Scope / Out-of-Scope are distinguished"
        points: 5
        check: "requirements.md In-Scope and Out-of-Scope sections each contain at least 1 item"
      - id: scope_no_block
        description: "There are no BLOCK questions about scope"
        points: 5
        check: "questions.md has 0 BLOCK questions with type=scope"

  - id: policy_exception
    name: "Policy/exception finalization"
    max_points: 20
    criteria:
      - id: policy_defined
        description: "Core business policies are specified"
        points: 10
        check: "requirements.md Functional Requirements contains policy-related items"
      - id: exception_handling
        description: "There is a policy for handling exceptions/errors/cancellations"
        points: 5
        check: "requirements.md describes exception handling or error scenarios"
      - id: policy_no_block
        description: "There are no policy-related BLOCK questions"
        points: 5
        check: "questions.md has 0 BLOCK questions with type=policy"

  - id: user_scenarios
    name: "User scenarios"
    max_points: 15
    criteria:
      - id: user_types
        description: "The main user types are identified"
        points: 5
        check: "requirements.md User Scenarios names at least 1 user type"
      - id: core_scenarios
        description: "The core scenarios are described"
        points: 5
        check: "requirements.md User Scenarios contains at least 2 scenarios"
      - id: edge_cases
        description: "Edge cases are identified"
        points: 5
        check: "requirements.md contains at least 1 exception/edge-case scenario"

  - id: nfr_check
    name: "NFR confirmation"
    max_points: 15
    criteria:
      - id: performance
        description: "Performance requirements are confirmed or 'not applicable' is specified"
        points: 5
        check: "requirements.md or technical-design.md mentions performance"
      - id: security
        description: "Security/authorization requirements are confirmed"
        points: 5
        check: "requirements.md contains security- or authorization-related requirements"
      - id: operations
        description: "Operational requirements (notifications, monitoring, batch) are confirmed"
        points: 5
        check: "requirements.md mentions operations, or states 'not applicable'"

  - id: approval_resolved
    name: "Resolution of approval items"
    max_points: 20
    cap_rule:
      condition: "When 1 or more BLOCK questions remain"
      max_allowed: 5
    criteria:
      - id: preconditions_resolved
        description: "All items listed in Approval Preconditions are resolved"
        points: 10
        check: "Every item in requirements.md Approval Preconditions is marked resolved"
      - id: zero_block
        description: "There are 0 BLOCK questions"
        points: 10
        check: "questions.md Summary has 0 OPEN questions in BLOCK state"

  - id: risk_assessment
    name: "Risk assessment"
    max_points: 15
    criteria:
      - id: risks_identified
        description: "Risks are identified"
        points: 5
        check: "requirements.md Initial Risk Assessment contains at least 1 item"
      - id: risk_mitigation
        description: "Each risk has a mitigation plan or an acceptance judgment"
        points: 5
        check: "Every identified risk has a documented response"
      - id: brownfield_impact
        description: "The impact on the existing system (brownfield) is understood"
        points: 5
        check: "For brownfield, affected existing modules/tables are specified. Greenfield scores 5 automatically"

  - id: user_stories_quality
    name: "User story quality"
    max_points: 10
    conditional: true
    activation: "Scored only when GATE-2.5 is triggered"
    criteria:
      - id: persona_quality
        description: "The personas reflect actual user types"
        points: 3
        check: "personas.md describes role, goals, and context concretely"
      - id: invest_compliance
        description: "The user stories satisfy the INVEST criteria"
        points: 4
        check: "The INVEST checklist in stories.md is fully satisfied"
      - id: gherkin_ac
        description: "The Acceptance Criteria are verifiable in Gherkin format"
        points: 3
        check: "Every AC in stories.md follows Given-When-Then"

  - id: system_design_quality
    name: "System structure design"
    max_points: 10
    conditional: true
    activation: "Scored only when GATE-2.7 is triggered"
    criteria:
      - id: component_separation
        description: "Component identification and separation of responsibilities are appropriate"
        points: 4
        check: "components.md clearly states each component's responsibility"
      - id: service_boundary
        description: "The service layer and API boundaries are clear"
        points: 3
        check: "services.md specifies operations and external exposure"
      - id: no_circular_dependency
        description: "The dependency matrix has no cycles"
        points: 3
        check: "component-dependency.md confirms no circular dependencies"

conditional_scoring:
  description: "Conditional bonus areas are scored only when their GATE is triggered"
  base_total: 100
  max_bonus: 20
  threshold_calculation: "Verdict thresholds are converted as 80%/60% of the actual maximum"

rules:
  - "If even one BLOCK question remains, the approval_resolved area is capped at 5 points"
  - "Never change a BLOCK to ASSUME just to raise the score"
  - "Record every score with its evidence"
  - "Score conditional bonus areas only when their GATE was triggered; untriggered areas are excluded from the maximum"
