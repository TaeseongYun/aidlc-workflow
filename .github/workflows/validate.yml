name: validate

# Runs the repo's existing validators on every PR and on pushes to main.
# All validators use only standard Unix tools (bash/grep/sed/awk) and run fully
# offline — no graphify, jq, or network access required (python3 stdlib only for
# the graph_inventory.py self-check).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    # macOS included: the scripts are authored on macOS (BSD grep/sed, bash 3.2)
    # and Linux-only CI already shipped one check that was dead on Macs.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # 1. Skill structure checks (entrypoint, frontmatter, no hardcoded paths,
      #    no cross-skill refs, referenced files exist). Exits non-zero on failure.
      - name: Validate skills
        run: bash tools/validate-skills.sh

      # 2. Helper-script self-checks (aidlc-log.sh, md-section.sh,
      #    graph_inventory.py, worktree_alloc.py, run-logger.ts).
      - name: Test helper scripts
        run: bash tools/test-scripts.sh

      # 2.5 Install/init smoke test: run twice against temp homes and a temp
      #     project; assert idempotency and that pruning removes stale skills
      #     without touching user files.
      - name: Install and init smoke test
        run: |
          set -euo pipefail
          CH="$(mktemp -d)"; XH="$(mktemp -d)"; PROJ="$(mktemp -d)"
          # seed a stale legacy skill and a user-owned command to verify pruning boundaries
          mkdir -p "$XH/skills/ctx-run" "$CH/commands"
          echo stale > "$XH/skills/ctx-run/SKILL.md"; echo stale > "$CH/commands/ctx-run.md"
          echo mine > "$CH/commands/user-own-command.md"
          CLAUDE_HOME="$CH" CODEX_HOME="$XH" bash scripts/install-skills.sh
          CLAUDE_HOME="$CH" CODEX_HOME="$XH" bash scripts/install-skills.sh
          CLAUDE_HOME="$CH" CODEX_HOME="$XH" bash scripts/install-skills.sh --platforms=android
          test -f "$XH/skills/_shared/skill-protocol.md"
          test -f "$CH/commands/ctx-aidlc-run.md"
          test -f "$CH/commands/android-testing.md"        # platform opt-in installed
          test ! -e "$XH/skills/ctx-run"                   # legacy skill pruned
          test ! -e "$CH/commands/ctx-run.md"
          test -f "$CH/commands/user-own-command.md"       # user files untouched
          ! grep -r "{{TEAM_AI_WORKFLOW_DIR}}" "$CH/commands" "$XH/skills"
          # init-project: must succeed, create the scaffold, and be idempotent
          ( cd "$PROJ" && git init -q . && bash "$GITHUB_WORKSPACE/scripts/init-project.sh" )
          test -f "$PROJ/ctx/INDEX.md"
          test -f "$PROJ/aidlc-docs/aidlc-state.md"
          ( cd "$PROJ" && bash "$GITHUB_WORKSPACE/scripts/init-project.sh" )
          [ "$(grep -c '^aidlc-docs/$' "$PROJ/.gitignore" || true)" -le 1 ]

      # 2.6 Shell static analysis (errors only — the class of bug that has
      #     already shipped twice: dead grep -P, ((VAR++)) under set -e).
      - name: Shellcheck (errors)
        run: |
          command -v shellcheck >/dev/null || { echo "shellcheck unavailable, skipping"; exit 0; }
          shellcheck -S error scripts/*.sh tools/*.sh tools/evaluator/*.sh

      # 2.7 Translation parity: README.ko/zh must list every skill README.md lists,
      #     and the skill table must match the skills/ directory.
      - name: Check README parity
        run: bash tools/check-readme-parity.sh

      # 3. Artifact/question/readiness-score checks against the golden baselines.
      #    Warnings are exit 0 (not a failure); only real errors exit non-zero.
      #    Run all baselines even if one fails, then fail the job if any did.
      - name: Validate golden baselines
        run: |
          set -u
          rc=0
          for dir in minimal-bugfix standard-feature comprehensive-platform; do
            echo "::group::validate-all $dir"
            bash tools/evaluator/validate-all.sh "examples/golden-baselines/$dir" || rc=1
            echo "::endgroup::"
          done
          exit "$rc"
